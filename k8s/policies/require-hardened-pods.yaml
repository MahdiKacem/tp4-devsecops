apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-hardened-app-pods
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root-and-restricted-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.example.com/enforced: "true"
      validate:
        message: >-
          Pods applicatifs : non-root, image par digest, sans privilèges,
          capacités supprimées, système de fichiers en lecture seule et ressources limitées.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - image: "*@sha256:*"
                securityContext:
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - image: "*@sha256:*"
                securityContext:
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
            =(ephemeralContainers):
              - image: "*@sha256:*"
                securityContext:
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
